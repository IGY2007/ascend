    <meta name="description" content="Build yourself. Track your progress." />
    <meta name="theme-color" content="#0E0B16" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS: app instalable desde Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Tema guardado (oscuro / claro / automático) antes del primer cuadro: sin parpadeo.
      ;(function () {
        try {
          var p = localStorage.getItem('ascend-theme') || 'system'
          var light =
            p === 'light' || (p === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
          var r = document.documentElement
          r.dataset.theme = light ? 'light' : 'dark'
          if (light) {
            r.classList.remove('dark')
            document.querySelector('meta[name=theme-color]').setAttribute('content', '#f7f5fc')
            document.querySelector('meta[name=color-scheme]').setAttribute('content', 'light')
            document
              .querySelector('meta[name=apple-mobile-web-app-status-bar-style]')
              .setAttribute('content', 'default')
          }
        } catch (e) {}
      })()
    </script>
